<!-- Two or three columns, one on mobile, never four. -->
<div class="nt-grid">
  <button
    class="nt-card nt-card--hover nt-stack"
    style="--gap: var(--sp-2)"
    type="button"
  >
    <h4>Approvals</h4>
    <p>Work waits on a sign-off that takes a week.</p>
  </button>
  <div
    class="nt-card nt-card--hover nt-card--accent nt-stack"
    style="--gap: var(--sp-2)"
  >
    <h4>Improve a core system</h4>
    <p>Change the system your team relies on while it keeps running.</p>
  </div>
  <div
    class="nt-card nt-card--support nt-stack"
    style="--gap: var(--sp-2); align-items: start"
  >
    <span class="nt-badge nt-badge--mint"
      ><span class="nt-badge__dot"></span>Availability</span
    >
    <p>Tell us what you want to ship and when.</p>
  </div>
</div>
