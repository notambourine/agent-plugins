<!-- One pink CTA per screen. -->
<div class="nt-cluster">
  <button class="nt-btn nt-btn--primary">Book a call</button>
  <button class="nt-btn nt-btn--secondary">See how it works</button>
  <button class="nt-btn nt-btn--ghost">Not now</button>
  <button class="nt-btn nt-btn--primary" disabled>Disabled</button>
</div>
<div class="nt-cluster" style="margin-top: var(--sp-4)">
  <button class="nt-btn nt-btn--secondary nt-btn--sm">Pause</button>
  <button class="nt-btn nt-btn--ghost nt-btn--sm">Reset</button>
  <button class="nt-btn nt-btn--secondary" aria-busy="true">Saving</button>
  <button class="nt-btn nt-btn--ghost nt-btn--icon" aria-label="Close">
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.75"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M18 6 6 18M6 6l12 12" />
    </svg>
  </button>
  <button class="nt-btn nt-btn--primary nt-btn--lg">
    Start a conversation
  </button>
</div>
