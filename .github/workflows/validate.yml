name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install Claude Code CLI
        run: sfw npm install -g @anthropic-ai/claude-code

      # No consumer of node_modules here; the firewall needs to see every fetch once per PR.
      - name: Install dependencies
        run: sfw npm ci

      # No --strict: it fails the missing version field this plugin omits by design.
      - name: Validate plugin + marketplace schema
        run: claude plugin validate .

      - name: Validate portable marketplace
        run: |
          jq -e '
            .name == "notambourine" and
            all(.plugins[];
              .source.source == "local" and
              (.source.path | startswith("./plugins/")) and
              (.policy.installation | IN("AVAILABLE", "INSTALLED_BY_DEFAULT", "NOT_AVAILABLE")) and
              (.policy.authentication | IN("ON_INSTALL", "ON_USE")) and
              (.category | type == "string" and length > 0)
            )
          ' .agents/plugins/marketplace.json
          while read -r src; do
            manifest="$src/plugin.json"
            test -f "$manifest" || {
              echo "::error::portable manifest missing: $manifest"
              exit 1
            }
            jq -e --arg name "$(basename "$src")" '
              ."$schema" == "https://agent-plugins.org/schemas/1.0.0/plugin.schema.json" and
              .name == $name and
              (.description | type == "string" and length > 0)
            ' "$manifest"
          done < <(jq -r '.plugins[].source.path' .agents/plugins/marketplace.json)

      # Remote rows are exempt: an outside user finds one by what it does, not our prefix.
      - name: Check nt- prefix on local plugins
        run: |
          bad=$(jq -r '.plugins[] | select(.source | type == "string")
                        | select(.name | startswith("nt-") | not) | .name' \
                 .claude-plugin/marketplace.json)
          [ -z "$bad" ] || { echo "::error::local plugin missing nt- prefix: $bad"; exit 1; }
          echo "all local plugins are nt-prefixed"

      # Host catalogs have different metadata; only local package identity is shared.
      - name: Check portable marketplace parity
        run: |
          portable=$(jq -c '
            [.plugins[] | {name, source: .source.path}]
            | sort_by(.name)
          ' .agents/plugins/marketplace.json)
          claude=$(jq -c --argjson portable "$portable" '
            [.plugins[] | select(.source | type == "string") | {name, source}]
            | map(select(.name as $name | $portable | any(.name == $name)))
            | sort_by(.name)
          ' .claude-plugin/marketplace.json)
          [ "$claude" = "$portable" ] || {
            echo "::error::portable plugin names or sources differ between marketplaces"
            echo "Claude:  $claude"
            echo "Portable: $portable"
            exit 1
          }

  # Every script below is node and git only; a step that shells out needs an OS carve-out.
  portable:
    # Serialized to keep a malformed manifest from paying for a macOS leg at 10x.
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Unwrapped and cached: `validate` already put this lockfile through the firewall.
      - name: Install dependencies
        run: npm ci

      # A plugin install runs no npm, so the skill directory has to be committed bytes.
      - name: Verify brand-kit mirror
        run: npm run brand

      # Offline half of the vendoring contract; vendor-skills.yml covers the network half.
      - name: Verify vendored skill merge base
        run: node scripts/vendor-skills.mjs verify

      - name: Check portable shell in first-party skills
        run: node scripts/check-portable.mjs

      - name: Run plugin hook tests
        run: npm test
